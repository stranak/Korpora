name: Korpora
options:
  bundleIdPrefix: cz.cuni.mff.ufal
  # Matches ManateeKit/Package.swift's own `.macOS(.v13)`, and is the
  # oldest macOS the code actually needs (NSTableViewDiffableDataSource is
  # the real floor, at macOS 11).
  #
  # Deliberately NOT the local macOS version. This was "27.0" for a while,
  # purely to silence ~35 cosmetic linker warnings ("object file was built
  # for newer macOS version than being linked") coming from the locally
  # built manatee-open static library - see docs/project-plan.md. That made
  # the project unbuildable by anyone not on the very newest Xcode, since a
  # deployment target can't exceed the SDK. Those warnings are worth less
  # than the project being buildable at all; they also come back on any
  # machine whose macOS differs from this number, so chasing them is
  # pointless in a project that builds manatee-open locally.
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

packages:
  ManateeKit:
    path: ../ManateeKit

targets:
  Korpora:
    type: application
    platform: macOS
    sources:
      - path: Korpora
    dependencies:
      - package: ManateeKit
        product: ManateeKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.cuni.mff.ufal.mac-corpora.dev
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Korpora/Info.plist
        CODE_SIGN_ENTITLEMENTS: Korpora/Korpora.entitlements

  KorporaTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: KorporaTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Korpora.app/Contents/MacOS/Korpora"
    dependencies:
      - target: Korpora

schemes:
  Korpora:
    build:
      targets:
        Korpora: all
        KorporaTests: [test]
    run:
      config: Debug
      environmentVariables:
        # A tiny dev-only corpus (scripts/build-dev-corpus.sh) so the "New
        # Concordance" sheet's corpus picker has something real to show when
        # running from Xcode. Not used by the shipped app in any real sense -
        # just a stand-in registry for interactive development.
        MANATEE_REGISTRY: "$(SRCROOT)/DevCorpus/registry"
    test:
      config: Debug
      targets:
        - KorporaTests
