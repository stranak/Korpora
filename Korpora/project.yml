name: Korpora
options:
  bundleIdPrefix: cz.cuni.mff.ufal
  # Deliberately the local macOS version, not the oldest the code could
  # support (it builds fine at 13.0 - verified 2026-09-09 - since nothing
  # here needs newer API; NSTableViewDiffableDataSource at macOS 11 is the
  # real floor). Matching the local OS is what keeps the ~41 "object file
  # was built for newer macOS version than being linked" linker warnings
  # silent, and this app is dev-only on a single machine, so that trade is
  # worth it here.
  #
  # Consequence to be aware of: a deployment target can't exceed the SDK,
  # so this pins *building the app* to the newest Xcode. It doesn't
  # restrict the engine - `ManateeKit` declares `.macOS(.v13)` and builds
  # and tests standalone (`swift build`/`swift test`) on older systems,
  # which is where cross-version portability actually matters (see
  # `manatee-open`'s `macos-arm64-portability` branch). Anyone on an older
  # Xcode who needs the app can override per build:
  #
  #   xcodebuild ... MACOSX_DEPLOYMENT_TARGET=13.0
  #
  # See docs/project-plan.md's "Deployment target / minimum toolchain".
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true

packages:
  ManateeKit:
    path: ../ManateeKit

targets:
  Korpora:
    type: application
    platform: macOS
    sources:
      - path: Korpora
    dependencies:
      - package: ManateeKit
        product: ManateeKit
    # Bundle encodevert/mkregexattr into Contents/Helpers/ for release
    # builds (see docs/project-plan.md's "Goal - Ship a signed GitHub
    # release", blocker 2: a shipped app can't find them via the #filePath
    # dev-checkout fallback). Gated on MANATEE_TOOLS_DIR so dev builds -
    # where the manatee-open checkout is right there and CorpusImporter
    # falls back to it - are byte-identical to before. Run
    # scripts/build-release-deps.sh and export the var it prints.
    postCompileScripts:
      - name: Bundle manatee import tools
        script: |
          if [ -z "${MANATEE_TOOLS_DIR:-}" ]; then
            echo "MANATEE_TOOLS_DIR unset - not bundling manatee tools (dev build uses the checkout at runtime)"
            exit 0
          fi
          helpers="${TARGET_BUILD_DIR}/${WRAPPER_NAME}/Contents/Helpers"
          mkdir -p "$helpers"
          # Nested code must be signed before the enclosing app (inside-out),
          # with the same identity and hardened runtime - Xcode's own CodeSign
          # step only signs the app itself, not stray executables in Helpers/.
          # Never `codesign --deep` to sign; it's for verification only.
          sign_flags="--force --options runtime"
          if [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ] && [ "${EXPANDED_CODE_SIGN_IDENTITY}" != "-" ]; then
            sign_flags="$sign_flags --timestamp"
          fi
          for tool in encodevert mkregexattr; do
            cp "${MANATEE_TOOLS_DIR}/${tool}" "${helpers}/${tool}" || exit 1
            chmod +x "${helpers}/${tool}"
            if [ "${CODE_SIGNING_ALLOWED:-YES}" = "YES" ] && [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]; then
              # Retried: --timestamp depends on Apple's timestamp server, and
              # one transient bad response ("timestamps differ by N seconds")
              # shouldn't fail a release build.
              signed=no
              for attempt in 1 2 3; do
                if codesign $sign_flags --sign "${EXPANDED_CODE_SIGN_IDENTITY}" "${helpers}/${tool}"; then
                  signed=yes; break
                fi
                echo "codesign ${tool} failed (attempt ${attempt}/3)"
                sleep 5
              done
              [ "$signed" = yes ] || exit 1
            fi
          done
          echo "Bundled manatee tools from ${MANATEE_TOOLS_DIR} into ${helpers}"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.cuni.mff.ufal.mac-corpora.dev
        MACOSX_DEPLOYMENT_TARGET: "27.0"
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Korpora/Info.plist
        CODE_SIGN_ENTITLEMENTS: Korpora/Korpora.entitlements
      # Distribution build: notarizable Developer ID signing (docs/
      # project-plan.md, "Goal - Ship a signed GitHub release", step 4).
      # Debug keeps Automatic signing and the 27.0 dev target above.
      #  - macOS 15 is the release floor (blocker-3 decision); the release
      #    deps script builds manatee-open and pcre2 at the same floor.
      #  - arm64 only: the static pcre2/manatee libs are arm64-only, and
      #    Release would otherwise build universal and fail linking x86_64.
      #  - Hardened runtime on; sandbox stays off (entitlements file).
      configs:
        Release:
          MACOSX_DEPLOYMENT_TARGET: "15.0"
          ARCHS: arm64
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Developer ID Application
          DEVELOPMENT_TEAM: 8YW3ZU8MFU
          ENABLE_HARDENED_RUNTIME: YES
          OTHER_CODE_SIGN_FLAGS: --timestamp

  KorporaTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: KorporaTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Korpora.app/Contents/MacOS/Korpora"
    dependencies:
      - target: Korpora

schemes:
  Korpora:
    build:
      targets:
        Korpora: all
        KorporaTests: [test]
    run:
      config: Debug
      environmentVariables:
        # A tiny dev-only corpus (scripts/build-dev-corpus.sh) so the "New
        # Concordance" sheet's corpus picker has something real to show when
        # running from Xcode. Not used by the shipped app in any real sense -
        # just a stand-in registry for interactive development.
        MANATEE_REGISTRY: "$(SRCROOT)/DevCorpus/registry"
    test:
      config: Debug
      targets:
        - KorporaTests
