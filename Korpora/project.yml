name: Korpora
options:
  bundleIdPrefix: cz.cuni.mff.ufal
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true

packages:
  ManateeKit:
    path: ../ManateeKit

targets:
  Korpora:
    type: application
    platform: macOS
    sources:
      - path: Korpora
    dependencies:
      - package: ManateeKit
        product: ManateeKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.cuni.mff.ufal.mac-corpora.dev
        MACOSX_DEPLOYMENT_TARGET: "27.0"
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Korpora/Info.plist
        CODE_SIGN_ENTITLEMENTS: Korpora/Korpora.entitlements

  KorporaTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: KorporaTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Korpora.app/Contents/MacOS/Korpora"
    dependencies:
      - target: Korpora

schemes:
  Korpora:
    build:
      targets:
        Korpora: all
        KorporaTests: [test]
    run:
      config: Debug
      environmentVariables:
        # A tiny dev-only corpus (scripts/build-dev-corpus.sh) so the "New
        # Concordance" sheet's corpus picker has something real to show when
        # running from Xcode. Not used by the shipped app in any real sense -
        # just a stand-in registry for interactive development.
        MANATEE_REGISTRY: "$(SRCROOT)/DevCorpus/registry"
    test:
      config: Debug
      targets:
        - KorporaTests
